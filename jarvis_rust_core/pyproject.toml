[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "jarvis_rust_core"
version = "108.0.0"
description = "J.A.R.V.I.S. Mark 108 (Sovereign Core) Native Rust Exoskeleton"
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py310", "pyo3/generate-import-lib"]
